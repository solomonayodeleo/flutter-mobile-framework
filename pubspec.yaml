name: flutter_mobile_framework
description: Shared Flutter framework and UI library for Fusion mobile applications
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  get_it: ^9.2.0
  go_router: ^17.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
